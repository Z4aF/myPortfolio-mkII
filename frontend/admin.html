<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f1117;
      color: #f5f5f5;
      padding: 24px;
    }

    h1 {
      margin-bottom: 20px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .back-link {
      color: #ffd54a;
      text-decoration: none;
      font-weight: bold;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .card {
      background: #1a1f2bb0;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    }

    .card h2 {
      font-size: 14px;
      margin: 0 0 10px;
      color: #bbb;
    }

    .card p {
      font-size: 28px;
      margin: 0;
      color: #ffd54a;
      font-weight: bold;
    }

    .table-wrap {
      overflow-x: auto;
      background: #1a1f2bb0;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #2a3142;
    }

    th {
      color: #ffd54a;
    }

    tr:hover {
      background: rgba(255, 213, 74, 0.06);
    }

    .muted {
      color: #aaa;
    }

    .error {
      color: #ff8a8a;
      margin-top: 12px;
    }

    .auth-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: #0f1117;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

.auth-box {
  background: #1a1f2b;
  padding: 30px;
  border-radius: 14px;
  text-align: center;
  box-shadow: 0 0 20px rgba(0,0,0,0.4);
}

.auth-box h2 {
  margin-bottom: 15px;
}

.auth-box input {
  padding: 10px;
  width: 220px;
  border-radius: 8px;
  border: none;
  outline: none;
  margin-bottom: 12px;
}

.auth-box button {
  padding: 10px 20px;
  border: none;
  border-radius: 8px;
  background: #ffd54a;
  cursor: pointer;
  font-weight: bold;
}

.auth-box button:hover {
  box-shadow: 0 0 10px rgba(255,213,74,0.7);
}

#authError {
  color: #ff8a8a;
  font-size: 12px;
  margin-top: 10px;
}
  </style>
</head>
<body>

    <div id="authOverlay" class="auth-overlay">
      <div class="auth-box">
        <h2>Admin Access</h2>
        <input type="password" id="adminPassword" placeholder="Enter password" />
        <button id="loginBtn">Enter</button>
        <p id="authError"></p>
      </div>
    </div>

  <div class="video-section projects">
    <video autoplay muted loop id="projects-video">
      <source src="assets/background.mp4" type="video/mp4" />
    </video>

  </div>

    <div class="top-bar">
      <h1>Visitor tracker</h1>
      <a class="back-link" href="index.html">Back</a>
    </div>

    <div class="cards">
      <div class="card">
        <h2>Total Unique Visitors</h2>
        <p id="totalUnique">-</p>
      </div>
      <div class="card">
        <h2>Total Logged Visits</h2>
        <p id="totalVisits">-</p>
      </div>
      <div class="card">
        <h2>Repeat Visitors</h2>
        <p id="repeatVisitors">-</p>
      </div>
      <div class="card">
        <h2>Latest Visit</h2>
        <p id="latestVisit" style="font-size: 18px;">-</p>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Visitor ID</th>
            <th>First Visit</th>
            <th>Last Visit</th>
            <th>Visit Count</th>
          </tr>
        </thead>
        <tbody id="visitorTable">
          <tr>
            <td colspan="4" class="muted">Loading...</td>
          </tr>
        </tbody>
      </table>
      <div id="errorBox" class="error"></div>
    </div>
  </div>

  <script>

    const overlay = document.getElementById("authOverlay");
    const input = document.getElementById("adminPassword");
    const btn = document.getElementById("loginBtn");
    const errorText = document.getElementById("authError");

    function unlock() {
      if (input.value === correctPassword) {
        overlay.style.display = "none";
        initAdmin(); // run your dashboard code
      } else {
        errorText.textContent = "Wrong password";
        input.value = "";
      }
    }

    const correctPassword = "*****";

    btn.addEventListener("click", unlock);

    input.addEventListener("keypress", (e) => {
      if (e.key === "Enter") unlock();
    });

    const API_URL = "https://8mifhw8243.execute-api.ap-southeast-2.amazonaws.com/admin/visitors";

    function formatUnix(ts) {
      if (!ts) return "-";
      return new Date(ts * 1000).toLocaleString();
    }

    function shortenVisitorId(id) {
      if (!id) return "-";
      if (id.length <= 16) return id;
      return id.slice(0, 8) + "..." + id.slice(-6);
    }

  function initAdmin() {
    fetch(API_URL + "?t=" + Date.now(), {
      method: "GET",
      cache: "no-store"
    })
      .then(res => {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(data => {
        const visitors = data.visitors || [];

        document.getElementById("totalUnique").textContent = visitors.length;

        const totalVisits = visitors.reduce((sum, v) => sum + (v.visit_count || 0), 0);
        document.getElementById("totalVisits").textContent = totalVisits;

        const repeatVisitors = visitors.filter(v => (v.visit_count || 0) > 1).length;
        document.getElementById("repeatVisitors").textContent = repeatVisitors;

        const latest = visitors.reduce((max, v) => {
          return !max || (v.last_visit || 0) > (max.last_visit || 0) ? v : max;
        }, null);

        document.getElementById("latestVisit").textContent = latest ? formatUnix(latest.last_visit) : "-";

        const tbody = document.getElementById("visitorTable");

        if (!visitors.length) {
          tbody.innerHTML = `
            <tr>
              <td colspan="4" class="muted">No visitor data found.</td>
            </tr>
          `;
          return;
        }

        visitors.sort((a, b) => (b.last_visit || 0) - (a.last_visit || 0));

        tbody.innerHTML = visitors.map(v => `
          <tr>
            <td title="${v.visitor_id}">${shortenVisitorId(v.visitor_id)}</td>
            <td>${formatUnix(v.first_visit)}</td>
            <td>${formatUnix(v.last_visit)}</td>
            <td>${v.visit_count || 0}</td>
          </tr>
        `).join("");
      })
      .catch(err => {
        console.error(err);
        document.getElementById("visitorTable").innerHTML = `
          <tr>
            <td colspan="4" class="muted">Failed to load visitor data.</td>
          </tr>
        `;
        document.getElementById("errorBox").textContent = err.message;
      });
    }
  </script>
</body>
</html>
